<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Action Node Documentation & Blueprint Wiki | NodeHotkey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/node-docs.css?v=3.1.3">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080c14;
      color: #f1f5f9;
      font-family: 'Outfit', 'Prompt', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Standalone Header */
    .docs-navbar {
      height: 50px;
      background: #0d1322;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      flex-shrink: 0;
      z-index: 100;
    }

    .docs-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
    }

    .docs-logo-gem {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      box-shadow: 0 0 14px rgba(59, 130, 246, 0.4);
    }

    .docs-brand-text {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .docs-badge {
      font-size: 10.5px;
      font-weight: 700;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: #60a5fa;
      padding: 2px 7px;
      border-radius: 999px;
    }

    .docs-nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-docs-nav {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn-docs-nav:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-docs-nav.primary {
      background: rgba(59, 130, 246, 0.15);
      border-color: rgba(59, 130, 246, 0.35);
      color: #60a5fa;
    }

    .btn-docs-nav.primary:hover {
      background: rgba(59, 130, 246, 0.25);
      border-color: #3b82f6;
      color: #93c5fd;
    }

    /* Lang Toggle */
    .docs-lang-wrap {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .docs-lang-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .docs-lang-btn.active {
      background: #2563eb;
      color: #fff;
    }

    #docs-root {
      flex: 1 1 0%;
      height: calc(100vh - 50px);
      min-height: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- Standalone Top Bar -->
  <header class="docs-navbar">
    <div class="docs-brand">
      <div class="docs-logo-gem">⚡</div>
      <div class="docs-brand-text">
        <span>NodeHotkey</span>
        <span style="color: rgba(255,255,255,0.3);">/</span>
        <span style="color: #cbd5e1;" id="nav-wiki-title">Action Node Wiki & Blueprint Reference</span>
        <span class="docs-badge" id="nav-node-count-badge">29 Nodes</span>
      </div>
    </div>

    <div class="docs-nav-actions">
      <!-- Back to Studio -->
      <a href="/" class="btn-docs-nav primary" title="กลับไปยังหน้า Canvas Studio">
        <span>🎮</span>
        <span id="nav-btn-studio">Action Node Studio</span>
      </a>

      <!-- Language Toggle -->
      <div class="docs-lang-wrap">
        <button class="docs-lang-btn active" id="btn-lang-th" onclick="setDocLanguage('th')">TH</button>
        <button class="docs-lang-btn" id="btn-lang-en" onclick="setDocLanguage('en')">EN</button>
      </div>
    </div>
  </header>

  <!-- Docs Component Mount Container -->
  <main id="docs-root"></main>

  <!-- Script Modules -->
  <script src="/js/components/node-docs-icons.js?v=3.1.6"></script>
  <script src="/js/node-registry-client.js?v=3.2.1"></script>
  <script src="/js/components/node-docs-data.js?v=3.1.6"></script>
  <script src="/js/components/node-docs.js?v=3.1.6"></script>

  <script>
    let currentDocLang = localStorage.getItem('nodehotkey_lang') || 'th';
    let docsComponent = null;

    function updateNavLabels(lang) {
      const isEn = lang === 'en';
      const wikiTitle = document.getElementById('nav-wiki-title');
      const btnStudio = document.getElementById('nav-btn-studio');
      const btnTh = document.getElementById('btn-lang-th');
      const btnEn = document.getElementById('btn-lang-en');

      if (wikiTitle) {
        wikiTitle.textContent = isEn ? 'Action Node Wiki & Blueprint Reference' : 'คู่มือการใช้งาน Action Node & Blueprint Reference';
      }
      if (btnStudio) {
        btnStudio.textContent = isEn ? 'Back to Studio' : 'กลับไป Action Node Studio';
      }
      if (btnTh && btnEn) {
        btnTh.classList.toggle('active', lang === 'th');
        btnEn.classList.toggle('active', lang === 'en');
      }
    }

    function setDocLanguage(lang) {
      currentDocLang = lang;
      try { localStorage.setItem('nodehotkey_lang', lang); } catch (e) {}
      updateNavLabels(lang);
      if (docsComponent) {
        docsComponent.setLanguage(lang);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateNavLabels(currentDocLang);

      const root = document.getElementById('docs-root');
      if (window.NodeDocsComponent && root) {
        docsComponent = new window.NodeDocsComponent({
          container: root,
          lang: currentDocLang,
          showTitle: true
        });

        // Update count badge dynamically from catalog
        const badge = document.getElementById('nav-node-count-badge');
        if (badge && window.NodeDocsData && Array.isArray(window.NodeDocsData.catalog)) {
          badge.textContent = `${window.NodeDocsData.catalog.length} Nodes`;
        }
      }
    });
  </script>
</body>
</html>
