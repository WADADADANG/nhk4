[package]
name = "nodehotkey-rust"
version = "4.0.0"
edition = "2021"

[dependencies]
# Async Runtime & Concurrency
tokio = { version = "1.40", features = ["full"] }
futures-util = "0.3"

# Data Serialization & JSON Profiles
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"

# File System & Config Watcher
notify = "6.1"

# Computer Vision & Pixel Processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Cross-Platform Audio Playback (Native, no PowerShell)
rodio = { version = "0.19", default-features = false, features = ["wav", "mp3"] }

# Cross-Platform Global Input & Hotkey Listening
rdev = "0.5"

# Browser DevTools Protocol (CDP) & Real-time License Sentinel (Pusher) WebSocket Communication
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-webpki-roots"] }

# HTTP & Web Requests (Edge TTS, Proxies)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tauri = { version = "2", features = ["tray-icon"] }
axum = "0.8.9"
tower-http = { version = "0.6", features = ["cors"] }
async-stream = "0.3.6"
base64 = "0.22"

# Security & Hardware Identification
sha2 = "0.10"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "rand_core"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
winapi = { version = "0.3.9", features = ["winuser", "wingdi", "processthreadsapi", "minwindef", "windef"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
tauri-build = "2"
